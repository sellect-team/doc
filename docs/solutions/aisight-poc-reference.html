<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>aisight 구축·PoC 레퍼런스</title>
  <meta name="doc-version" content="1.2">
  <meta name="doc-description" content="구축 완료·진행 중인 프로젝트 현황과 보안 통제 증적을 담은 레퍼런스 (8p)">
  <meta name="doc-source" content="aisight-poc-reference.pptx">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* 16:9 고정 캔버스 - 창 크기가 변해도 전체가 같은 비율로 확대·축소된다 */
    html { font-size: min(1.25vw, 2.2222vh); }
    body {
      font-family: "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: #ffffff; color: #1d1d1f;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
    }
    /* 원본 슬라이드를 그대로 담는 컨테이너 - 항상 16:9 */
    .slide {
      width: min(100vw, 177.7778vh); height: min(56.25vw, 100vh);
      overflow: hidden; position: relative; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #ffffff;
    }
    .slide img {
      width: 100%; height: 100%; object-fit: contain; display: block;
    }
    @media print {
      .slide img { width: 100%; height: 100%; object-fit: contain; }
    }
  </style>
</head>
<body>
  <section class="slide" data-title="표지">
    <img src="assets/aisight-poc-reference/slide-01.webp" alt="표지" decoding="async">
  </section>
  <section class="slide" data-title="진행 현황 한눈에">
    <img src="assets/aisight-poc-reference/slide-02.webp" alt="진행 현황 한눈에" decoding="async">
  </section>
  <section class="slide" data-title="사례 A · 구축 완료">
    <img src="assets/aisight-poc-reference/slide-03.webp" alt="사례 A · 구축 완료" decoding="async" loading="lazy">
  </section>
  <section class="slide" data-title="사례 B · 본 구축 · 8월 오픈">
    <img src="assets/aisight-poc-reference/slide-04.webp" alt="사례 B · 본 구축 · 8월 오픈" decoding="async" loading="lazy">
  </section>
  <section class="slide" data-title="사례 C · 12월 오픈 예정">
    <img src="assets/aisight-poc-reference/slide-05.webp" alt="사례 C · 12월 오픈 예정" decoding="async" loading="lazy">
  </section>
  <section class="slide" data-title="진행 · 예정 PoC 2건">
    <img src="assets/aisight-poc-reference/slide-06.webp" alt="진행 · 예정 PoC 2건" decoding="async" loading="lazy">
  </section>
  <section class="slide" data-title="보안과 통제">
    <img src="assets/aisight-poc-reference/slide-07.webp" alt="보안과 통제" decoding="async" loading="lazy">
  </section>
  <section class="slide" data-title="통제 기능 화면 증적">
    <img src="assets/aisight-poc-reference/slide-08.webp" alt="통제 기능 화면 증적" decoding="async" loading="lazy">
  </section>
</body>
</html>
