name: 사이트 빌드 & 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 버전 기록 추출에 전체 Git 이력 필요

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 사이트 데이터 빌드 (문서 목록 + 버전 이력)
        run: node scripts/build.mjs

      - name: Playwright 설치
        run: |
          npm install playwright@1.49.0
          npx playwright install --with-deps chromium

      - name: 슬라이드 전수검사 (영역 이탈·잘림)
        run: node scripts/check-overflow.mjs

      - name: PDF 생성
        run: node scripts/make-pdfs.mjs

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4

# 참고: MS 계정 로그인(Entra ID) 기반 접근 제어가 필요해지면
# Azure Static Web Apps로 전환한다. 이전 Azure 배포 설정은 git 이력
# (v1.3.7 이전 deploy.yml) 참고. 저장소를 비공개로 전환하는 것이 선행 조건.
