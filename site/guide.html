<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>문서 작성 지침</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/gate.js"></script>
  <script src="assets/live.js"></script>
</head>
<body>

<nav class="nav">
  <a class="brand" href="index.html">Docs<span class="dot">.</span></a>
  <div class="links">
    <a href="index.html">문서</a>
    <a href="reports.html">작업 리포트</a>
    <a href="guide.html">작성 지침</a>
  </div>
</nav>

<div class="guide-bar" id="guideBar"></div>

<main class="md-wrap" id="md">불러오는 중…</main>

<script>
// AUTHORING.md를 간단한 마크다운 렌더러로 표시 (외부 라이브러리 없이)
(async function () {
  const md = await fetch("data/authoring.md").then((r) => r.text());
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  const lines = md.split(/\r?\n/);
  let html = "", inCode = false, inList = false, inQuote = false, tableBuf = [];

  const inline = (s) =>
    esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--accent)">$1</a>');

  const closeAll = () => {
    if (inList) { html += "</ul>"; inList = false; }
    if (inQuote) { html += "</blockquote>"; inQuote = false; }
    flushTable();
  };
  const flushTable = () => {
    if (!tableBuf.length) return;
    const rows = tableBuf.filter((r) => !/^\s*\|[\s\-|:]+\|\s*$/.test(r));
    html += "<table>" + rows.map((r, i) => {
      const cells = r.replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      const tag = i === 0 ? "th" : "td";
      return "<tr>" + cells.map((c) => `<${tag}>${c}</${tag}>`).join("") + "</tr>";
    }).join("") + "</table>";
    tableBuf = [];
  };

  for (const line of lines) {
    if (line.startsWith("```")) {
      closeAll();
      html += inCode ? "</code></pre>" : "<pre><code>";
      inCode = !inCode;
      continue;
    }
    if (inCode) { html += esc(line) + "\n"; continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) { tableBuf.push(line); continue; }
    flushTable();

    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) {
      closeAll();
      html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;
    } else if (/^---+\s*$/.test(line)) {
      closeAll(); html += "<hr>";
    } else if ((m = line.match(/^>\s?(.*)/))) {
      if (!inQuote) { closeAll(); html += "<blockquote>"; inQuote = true; }
      html += `<p>${inline(m[1])}</p>`;
    } else if ((m = line.match(/^\s*[-*]\s+(.*)/))) {
      if (inQuote) { html += "</blockquote>"; inQuote = false; }
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inline(m[1])}</li>`;
    } else if (line.trim() === "") {
      closeAll();
    } else {
      closeAll();
      html += `<p>${inline(line)}</p>`;
    }
  }
  closeAll();
  document.getElementById("md").innerHTML = html;
})();

// 지침 문서 내려받기 - 합본 한 번에 또는 문서별로
(async function () {
  const g = await fetch("data/guides.json").then((r) => r.json()).catch(() => null);
  if (!g) return;
  const kb = (n) => `${Math.round(n / 1024)}KB`;
  const save = async (file, label) => {
    const res = await fetch("data/" + file).catch(() => null);
    if (!res || !res.ok) { alert("파일을 찾을 수 없습니다: " + file); return; }
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement("a");
    a.href = url; a.download = label || file; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const bar = document.getElementById("guideBar");
  bar.innerHTML =
    `<button class="btn primary" id="dlAll">지침 전체 내려받기 (${g.docs.length}건 · ${kb(g.bundle.bytes)})</button>` +
    g.docs.map((d, i) =>
      `<button class="btn ghost" data-i="${i}" title="${d.desc}">${d.file} · ${kb(d.bytes)}</button>`).join("");
  bar.querySelector("#dlAll").onclick = () =>
    save(g.bundle.file, `세일링스톤 문서 지침 모음.md`);
  bar.querySelectorAll("[data-i]").forEach((b) => {
    b.onclick = () => save(g.docs[b.dataset.i].file);
  });
})();
</script>
</body>
</html>
